# ─────────────────────────────────────────────────────────────
#  arXiv daily digest — KAIST Computer Vision and Learning lab (KCVL, Prof. Tae-Kyun Kim)
#  Lab-wide profile, served from the lab machine (run.py --serve), never published to GitHub Pages.
#  Use with:  run.py --config config.kcvl.yaml   (run_daily.sh passes extra arguments through)
# ─────────────────────────────────────────────────────────────

categories:
  - cs.AI   # Artificial Intelligence
  - cs.CV   # Computer Vision and Pattern Recognition
  - cs.GR   # Graphics
  - cs.LG   # Machine Learning
  - cs.RO   # Robotics 
  - stat.ML # Machine Learning (statistics)

# "new" = first appearance, "cross" = cross-listed into one of your categories.
announce_types: [new, cross]

# Written from the lab's research statement and 2026 postdoc call (physical AI, generative AI,
# world models), its 2023–2026 publications (https://sites.google.com/view/tkkim/publications),
# and papers members are reading now (world models, autoregressive video diffusion, robot
# learning). The lab is broad, so the profile is broad too.
interest_profile: |
  This is a lab-wide digest for a computer vision and machine learning lab working on machine (deep) learning for 3D computer vision, generative AI, AI with physics, man-machine interfaces and robotics. Several students read it, so a paper only has to matter to one of the topics below.

  Core interests:
  - Physical AI: physics-based reconstruction and simulation (MPM, deformable and articulated objects, cloth), physics-aware video and 3D generation, differentiable physics, simulation as supervision, physics-neural hybrid models learned from video
  - 3D hand reconstruction and pose: single and interacting two hands, hand-object and hand-deformable-object interaction, grasping and grasp synthesis, hand texture and shape, egocentric hand tracking, diffusion-based hand pose estimation
  - 3D human body, motion and avatars: reconstruction from images or occlusion, animatable and multi-layered (clothed) Gaussian avatars, egocentric and whole-body motion, controllable and large-scale motion generation (diffusion, flow), motion priors for physics-based character control, human-object interaction
  - Robot learning and embodied AI: dexterous and deformable-object manipulation, whole-body and mobile manipulation, learning from human demonstrations and videos, generalist robot policies and vision-language-action models (VLAs) and how to steer or adapt them, sim-to-real
  - 3D/4D reconstruction: 3D/2D Gaussian splatting, neural implicit surfaces, dynamic and 4D scenes and surfaces, sparse-view surface reconstruction, 2D-3D inpainting and editing
  - World models: video world models and world simulators (interactive, action- or camera-conditioned, egocentric and embodied), long-horizon memory and consistency when a scene is revisited (KV-cache retrieval, compression and compositing), physics-informed and 4D world models, learned particle and neural-operator simulators, world models for planning, reasoning and robot learning
  - Autoregressive diffusion transformers: autoregressive and causal (chunk-wise, streaming) video diffusion, long video generation, KV caching, sparse and dynamics-aware attention, distillation and few-step sampling for real-time generation
  - Video diffusion transformers: architecture, training, camera and motion control, video generation with 3D consistency, and efficient inference (caching, distillation, quantization, sparse attention)
  - Generative models: diffusion, flow matching and score-based models for images, video, 3D and motion
  - Transformer architecture research: vision transformers (ViT), state space models (SSMs, e.g. Mamba), linear and sparse attention, positional encodings, efficient multimodal LLMs (visual token pruning and sparse vision-language interaction), and other efficient or alternative sequence models
  - 6D object pose estimation (category-level, model-free, one-shot) and 3D object detection (including semi-supervised)

  Secondary interests:
  - Multimodal foundation models and vision-language models, and their use in robotics,
    embodied AI and AI4Science (e.g. protein structure and function)
  - Action recognition (skeleton, body-hand) and human and pedestrian trajectory prediction
  - Image restoration and enhancement (adverse weather, low light), text-guided image editing,
    self-supervised depth estimation, person re-identification

  Important beyond these topics (read by everyone in the lab):
  - General-purpose building blocks (architectures, attention, optimizers, training recipes)
  - Methods that transfer across computer vision, graphics, robotics and deep learning

  Not interested (exclude unless the paper clearly connects to an interest above):
  - Remote sensing and satellite imagery
  - Adversarial robustness
  - Federated learning
  - Text-only LLM work: alignment, safety, prompting, agents, reasoning benchmarks
  - Tabular, time-series and recommender-system methods
  - Optimization and learning theory with no vision, generation or robotics angle

# Field-wide landmarks: teach the IMPACT score what "everyone in the lab should read this" means.
broad_examples:
  - "Attention Is All You Need"
  - "Deep Residual Learning for Image Recognition"
  - "Denoising Diffusion Probabilistic Models"
  - "Flow Matching for Generative Modeling"
  - "Scalable Diffusion Models with Transformers"
  - "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale"
  - "Mamba: Linear-Time Sequence Modeling with Selective State Spaces"
  - "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention"
  - "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis"
  - "3D Gaussian Splatting for Real-Time Radiance Field Rendering"
  - "SMPL: A Skinned Multi-Person Linear Model"
  - "Segment Anything"
  - "DINOv2: Learning Robust Visual Features without Supervision"
  - "Learning Transferable Visual Models From Natural Language Supervision"

# PI and frequent collaborators, as arXiv lists them (accents are ignored when matching).
# Students are left out on purpose: common names such as "Minje Kim" or "Donghwan Kim" would
# match unrelated authors every day and hand out the author bonus.
watch_authors:
  - Angjoo Kanazawa
  - Chelsea Finn
  - Li Fei-Fei

# Institutions / labs (matched case-insensitively against affiliations from the arXiv HTML).
watch_institutions:
  - Stanford
  - MIT
  - "Carnegie Mellon|CMU"
  - "UC Berkeley"
  - NVIDIA
  - Apple
  - "Google DeepMind|Google Research|Google"
  - "Meta|FAIR|Reality Labs"

ranking:
  author_bonus: 3.0
  institution_bonus: 1.0   # lower than the personal config: the list is broad and KAIST is common
  min_interest_for_bonus: 4
  impact_min: 7
  impact_weight: 0.9
  impact_review_n: 20
  quality_weight: 0.3

limits:
  enrich_top_n: 50         # broader profile → a few more candidates for the affiliation check
  summarize_top_k: 20      # more readers → a few more summaries
  db_min_interest: 0
  db_max_papers: 300000
  site_max_papers: 6000    # only used by the static site (off here); the served site shows the whole DB
  site_min_interest: 2
  rescue_k: 5
  rescue_min_interest: 7

models:
  scorer: claude-haiku-5-5
  summarizer: claude-sonnet-5-5
  score_batch_size: 20

explain:
  # "Explain this paper" on the local site (run.py --serve), or run.py --explain ID: Opus reads
  # the whole PDF and writes down the paper's key information (≈ $0.20 and ~1 min per paper).
  # Saved in the database and shown on both sites; costs are logged in table explain_costs.
  enabled: true            # false hides the button and refuses requests on the local site
  model: claude-opus-5-5
  effort: high             # low | medium | high | xhigh | max
  daily_budget_usd: 5      # the local site refuses new requests once today's cost reaches this; 0 = no cap

feedback:
  # Ratings, likes and bookmarks on the lab server come from everyone using it, so this
  # learns the lab's shared taste. Picks made while logged in (delivery.login) stay personal
  # and don't feed the scorer.
  enabled: true
  min_rating: 4
  max_examples: 40

zotero:
  # Off for the lab: likes and bookmarks stay on the lab server, even if .env holds a Zotero key.
  enabled: false
  collection: arxiv-digest-lab
  tag: arxiv-digest-lab
  note: true
  pdf_link: true

delivery:
  discord: false             # off for the lab: no digest, empty-feed or failure messages
  site: false                # no static site/: the lab reads the live server (run.py --serve)
  publish: false             # never push to GitHub Pages
  publish_branch: gh-pages   # not used
  site_title: KCVL arXiv digest
  about: true                # ⓘ "About this digest" on the site, shown on a visitor's first visit
  icon: lab                  # green favicon (favicon-lab.svg), to tell the lab's tab from a personal digest's
  login: true                # optional accounts: logged in, ratings/likes/bookmarks and "for you ♥" are your own
