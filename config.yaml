# ─────────────────────────────────────────────────────────────
#  arXiv daily digest — edit this file to tune your recommendations
# ─────────────────────────────────────────────────────────────

categories:
  - cs.CV    # Computer Vision and Pattern Recognition
  - cs.GR    # Graphics
  - cs.CG    # Computational Geometry
  - cs.LG    # Machine Learning
  - stat.ML  # Machine Learning (Statistics)

# "new" = first appearance, "cross" = cross-listed into one of your categories.
# Add "replace" / "replace-cross" to also see updated versions (noisy).
announce_types: [new, cross]

# Describe your interests in plain language. This is the single most
# important setting: Claude scores every abstract against it.
interest_profile: |
  My research focuses on world models, especially 3D/4D reconstruction and video diffusion transformers.
  
  Core interests (highest priority):
  - 3D/4D reconstruction, both optimization-based (e.g., NeRF, 3D Gaussian Splatting) and feed-forward
  - Video generation with 3D/4D consistency, camera control, and world models
  - Efficient inference for video diffusion transformers (e.g., caching, distillation, few-step sampling, quantization, sparse attention)
  - Transformer architectures and alternatives, such as linear and sparse attention
  
  Secondary interests (for inspiration and broader context):
  - Probabilistic generative models, including diffusion, score-based, and flow-matching models
  - Bayesian methods, including MCMC and variational inference
  - Mathematical and physics-based perspectives on deep learning, such as the theory of optimization dynamics and attention (e.g., self-attention as a modern Hopfield network)
  
  Important beyond my subfield (I read these too):
  - General-purpose building blocks (optimizers, normalization, architectures, attention)
  - Methods that transfer across computer vision, graphics and deep learning
  - Theory that explains widely used practice
  
  Not interested (exclude unless the paper clearly connects to a core interest):
  - Medical imaging
  - Remote sensing
  - Adversarial robustness
  - Federated learning

# Papers you consider "exactly my taste". Titles (or arXiv IDs) are enough.
# From your Zotero library (Inbox + Overleaf); general citations such as PyTorch, SMPL and the
# classic Bayesian-network papers are left out because they say little about taste.
seed_papers:
  # 3D Gaussian Splatting
  - "3D Gaussian Splatting for Real-Time Radiance Field Rendering"
  - "3D Gaussian Splatting as Markov Chain Monte Carlo"
  # dynamic / 4D reconstruction
  - "Shape of Motion: 4D Reconstruction from a Single Video"
  - "4D Gaussian Splatting for Real-Time Dynamic Scene Rendering"
  - "Real-time Photorealistic Dynamic Scene Representation and Rendering with 4D Gaussian Splatting"
  - "SC-GS: Sparse-Controlled Gaussian Splatting for Editable Dynamic Scenes"
  - "GP-4DGS: Probabilistic 4D Gaussian Splatting from Monocular Video via Variational Gaussian Processes"
  # articulated / animatable
  - "RigGS: Rigging of 3D Gaussians for Modeling Articulated Objects in Videos"
  - "Template-free Articulated Gaussian Splatting for Real-time Reposable Dynamic View Synthesis"
  - "3DGS-Avatar: Animatable Avatars via Deformable 3D Gaussian Splatting"
  - "HumanNeRF: Free-viewpoint Rendering of Moving People from Monocular Video"
  # world models
  - "World Motion Models: Flexible Sequence Modeling of SE(3) Trajectories"
  # video generation and world models
  - "4Director: Controlling Video World Models with Rigid 3D Geometry"
  - "MosaiChunk: Compositing Spatio-Temporal Memory for Autoregressive Video Generation"
  - "LongTake: Learning to Sustain Dynamics in Long-Horizon Video Generation"
  # efficient diffusion transformers and attention
  - "Dynamics-Aware Sparse Attention for Efficient Autoregressive Video Diffusion"
  - "RECAP: Reciprocal Sparse Attention and Hierarchical Caching for Efficient Video Diffusion"
  - "HRoPE: Homography Relative Positional Encoding"
  - "WorldRoPE: Probabilistic World-Centric Rotary Embedding for Multi-View Attention"

# Papers you value for their field-wide importance rather than your topic: they teach the
# IMPACT score what "everyone in CV / graphics / DL should read this" means to you.
# Kept apart from seed_papers so they don't pull the relevance score away from your subfield.
broad_examples:
  - "Adam: A Method for Stochastic Optimization"
  - "Attention Is All You Need"
  - "Deep Residual Learning for Image Recognition"
  - "Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift"
  - "Denoising Diffusion Probabilistic Models"
  - "Flow Matching for Generative Modeling"
  - "LoRA: Low-Rank Adaptation of Large Language Models"
  - "Hopfield Networks is All You Need"
  - "Wan: Open and Advanced Large-Scale Video Generative Models"

# Researchers whose new papers you never want to miss (matched against author lists).
# Use the name exactly as it appears on arXiv (word order matters).
watch_authors:
  - Li Fei-Fei            # how arXiv lists Fei-Fei Li
  - Angjoo Kanazawa

# Institutions / labs (matched case-insensitively against affiliations
# extracted from the paper's arXiv HTML page). Aliases help matching.
watch_institutions:
  - Stanford
  - "Massachusetts Institute of Technology|MIT"
  - "UC Berkeley|University of California, Berkeley"
  - "Carnegie Mellon|CMU"
  - "ETH Zurich|ETH Zürich"
  - "Max Planck"
  - "Google DeepMind|Google Research|Google"
  - "Meta|FAIR"
  - NVIDIA
  - "ByteDance|Seed"
  - "Alibaba|Tongyi"

ranking:
  author_bonus: 3.0        # added if any watched author is on the paper
  institution_bonus: 1.5   # added if any watched institution appears
  min_interest_for_bonus: 4 # watched-group bonus only applies if interest >= this (0-10)
  impact_min: 7            # papers rated this high for field-wide impact are kept regardless of
  impact_weight: 0.9       # your interests: final score is at least impact_weight × impact
                           # (a 9 lands at 8.1, among the top picks). They also reach the site
                           # from impact_min − 1 and get a summary. Set impact_min: 11 to disable.
  impact_review_n: 20      # the summarizer re-judges impact for the top N papers by impact
                           # (one call, ≈ $0.03/day) so the cheap scorer can't bury them. 0 = off
  quality_weight: 0.3      # 0 = rank by relevance only; 0.3 = a 0-quality paper keeps 70% of its
                           # relevance score, a 10-quality paper keeps 100%. Raise to favour quality.

limits:
  enrich_top_n: 40         # fetch arXiv HTML (affiliations + intro) for this many candidates
  summarize_top_k: 15      # Sonnet summaries for the final top K
  db_min_interest: 0       # keep papers scoring >= this in data/digest.db (0 = every scored paper, ~1 MB/day)
  db_max_papers: 300000    # LOCAL database only (never pushed anywhere). FIFO: when it holds more, the
                           # oldest are deleted (~400/day → ~3 years, ~650 MB). Rated, liked and
                           # bookmarked papers are never deleted. 0 = no limit.
  site_max_papers: 6000    # PUBLIC GitHub Pages site only: newest N papers (~65 days). The full
                           # history stays in the local DB and the local site (run.py --serve).
  site_min_interest: 2     # show papers with relevance >= this on the website. Deliberately low:
                           # scores are noisy, and you can raise the cutoff in the site's score filter
  rescue_k: 5              # + up to this many papers with relevance >= rescue_min_interest that a
  rescue_min_interest: 7   #   low quality score pushed out of the top k, so noise can't hide them

models:
  scorer: claude-haiku-5-5      # cheap, scores every abstract
  summarizer: claude-sonnet-5-5 # summarizes the shortlist
  score_batch_size: 20          # abstracts per scoring call

feedback:
  # Papers you like, bookmark, or rate >= min_rating, on the local site (run.py --serve) are fed back into
  # the scorer as positive examples. min_rating also sets what counts as a pick for the taste score.
  enabled: true
  min_rating: 4
  max_examples: 30

zotero:
  # Liked and bookmarked papers are pushed to your Zotero library (needs ZOTERO_API_KEY in .env).
  collection: arxiv-digest   # created if missing
  tag: arxiv-digest
  note: true                 # child note with the TL;DR, why-you and scores
  pdf_link: true             # linked-URL attachment to the arXiv PDF (uses no Zotero storage)

delivery:
  discord: true              # one "digest updated" message with a link to the site
  site: true                 # keep data/digest.db and build the website in site/
  publish: true              # push site/ to the gh-pages branch (GitHub Pages)
  publish_branch: gh-pages
  site_title: arXiv digest
  # site_url: https://you.github.io/arxiv-digest/   # default: derived from the git remote
