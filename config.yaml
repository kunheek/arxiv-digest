# ─────────────────────────────────────────────────────────────
#  arXiv daily digest — edit this file to tune your recommendations
# ─────────────────────────────────────────────────────────────

categories: [cs.CV, cs.CG, cs.LG, stat.ML]

# "new" = first appearance, "cross" = cross-listed into one of your categories.
# Add "replace" / "replace-cross" to also see updated versions (noisy).
announce_types: [new, cross]

# Describe your interests in plain language. This is the single most
# important setting: Claude scores every abstract against it.
interest_profile: |
  My research interests are in world models in general, and 3D/4D reconstruction and video diffusion transformers in particular.
  I am also interested in deep learning architectures (i.e., transformers), optimization and Bayesian methods, and probabilistic generative models.
  I am not interested in medical imaging, remote sensing, pure NLP/LLM papers, adversarial robustness, or federated learning, unless they clearly touch the above.
  Core interests:
  - Both optimization-based and feed-forward 3D/4D reconstruction
  - Efficient inference for video diffusion transformers
  - Video generation with 3D/4D consistency, camera control, world models
  - New architectures, such as linear and sparse attention
  Secondary interests (for inspiration and context):
  - Probabilistic generative models, including diffusion and score-based models
  - Optimization for deep learning (e.g., MUON)
  - Bayesian methods, including MCMC and variational inference

# Papers you consider "exactly my taste". Titles (or arXiv IDs) are enough.
seed_papers:
  - "3D Gaussian Splatting as Markov Chain Monte Carlo"
  - "Shape of Motion: 4D Reconstruction from a Single Video"

# Researchers whose new papers you never want to miss (matched against author lists).
# Use the name exactly as it appears on arXiv.
watch_authors:
  - Fei-Fei Li
  - Angjoo Kanazawa

# Institutions / labs (matched case-insensitively against affiliations
# extracted from the paper's arXiv HTML page). Aliases help matching.
watch_institutions:
  - Stanford
  - "Massachusetts Institute of Technology|MIT"
  - "UC Berkeley|University of California, Berkeley"
  - "Carnegie Mellon|CMU"
  - "ETH Zurich|ETH Zürich"
  - "Max Planck"
  - "Google DeepMind|Google Research|Google"
  - "Meta|FAIR"
  - NVIDIA
  - "ByteDance|Seed"
  - "Alibaba|Tongyi"

ranking:
  author_bonus: 3.0        # added if any watched author is on the paper
  institution_bonus: 1.5   # added if any watched institution appears
  min_interest_for_bonus: 4 # watched-group bonus only applies if interest >= this (0-10)
  impact_min: 7            # papers rated this high for field-wide impact are kept regardless of
  impact_weight: 0.9       # your interests: final score is at least impact_weight × impact
                           # (a 9 lands at 8.1, among the top picks). They also reach the site
                           # from impact_min − 1 and get a summary. Set impact_min: 11 to disable.
  quality_weight: 0.3      # 0 = rank by relevance only; 0.3 = a 0-quality paper keeps 70% of its
                           # relevance score, a 10-quality paper keeps 100%. Raise to favour quality.

limits:
  enrich_top_n: 40         # fetch arXiv HTML (affiliations + intro) for this many candidates
  summarize_top_k: 15      # Sonnet summaries for the final top K
  db_min_interest: 0       # keep papers scoring >= this in data/digest.db (0 = every scored paper, ~1 MB/day)
  db_max_papers: 50000     # FIFO: when the DB holds more, the oldest are deleted (~450/day, so
                           # ~110 days). Rated and bookmarked papers are never deleted. 0 = no limit.
  site_min_interest: 2     # show papers with relevance >= this on the website. Deliberately low:
                           # scores are noisy, and you can raise the cutoff in the site's score filter
  rescue_k: 5              # + up to this many papers with relevance >= rescue_min_interest that a
  rescue_min_interest: 7   #   low quality score pushed out of the top k, so noise can't hide them

models:
  scorer: claude-haiku-5-5      # cheap, scores every abstract
  summarizer: claude-sonnet-5-5 # summarizes the shortlist
  score_batch_size: 20          # abstracts per scoring call

feedback:
  # Papers you rate on the website (1-5 stars; export + `run.py --import-ratings`)
  # are fed back into the scorer as positive examples.
  enabled: true
  min_rating: 4
  max_examples: 30

delivery:
  discord: true              # one "digest updated" message with a link to the site
  site: true                 # keep data/digest.db and build the website in site/
  publish: true              # push site/ to the gh-pages branch (GitHub Pages)
  publish_branch: gh-pages
  site_title: arXiv digest
  # site_url: https://you.github.io/arxiv-digest/   # default: derived from the git remote
