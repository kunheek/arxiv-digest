name: daily-arxiv-digest

on:
  schedule:
    # arXiv RSS refreshes around midnight US Eastern (13:00–14:00 KST).
    # 06:07 UTC = 15:07 KST, Mon–Fri. arXiv publishes nothing on weekends.
    - cron: "7 6 * * 1-5"
  workflow_dispatch:          # "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Dry run (no Discord/Sheets)"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job commit state/seen.json

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK:   ${{ secrets.DISCORD_WEBHOOK }}
          GOOGLE_CREDS:      ${{ secrets.GOOGLE_CREDS }}
          SHEET_ID:          ${{ secrets.SHEET_ID }}
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Show digest in run summary
        if: always()
        run: test -f digest.md && cat digest.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save state (which papers were already seen)
        if: success()
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "digest state $(date -u +%F)"
          git push
